<!doctype html>
<!--
  `lang` is intentionally absent here: the bootstrap script below sets it from the
  stored locale before anything paints. `data-theme` is set by the same script.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Lets the user agent paint its own canvas in the right scheme while the
         stylesheets are still in flight; the real palette lives in tokens.css. -->
    <meta name="color-scheme" content="dark light" />
    <title>LV Copytrader — Telegram to MetaTrader 5</title>

    <!--
      DO NOT MOVE THIS SCRIPT INTO REACT. It is inline, in <head>, and runs before
      any bundle or stylesheet is applied, because applying theme or locale in a
      React effect means every reload flashes white before going dark, or English
      before switching to Russian — invisible on a fast dev machine, obvious to the
      person who stares at this dashboard all day. The try/catch is equally
      load-bearing: localStorage does not merely return null in some privacy modes,
      it throws outright, and an unguarded read would leave the page unthemed and
      untranslated. Copied verbatim from BUILD_PROMPT §10; keep it that way.
    -->
    <script>
      try {
        var storedTheme = localStorage.getItem('sp-theme');
        var t = (storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : null) ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var storedLocale = localStorage.getItem('sp-locale');
        var l = (storedLocale === 'ru' || storedLocale === 'en' ? storedLocale : null) ||
                ((navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('lang', 'en');
      }
    </script>

    <meta name="description" content="Open-source Telegram-to-MetaTrader 5 automation on your VPS. Explore the demo or join the waitlist for a simpler installation." />
    <link rel="icon" type="image/webp" sizes="96x96" href="/assets/brand/icon-web-459b2dba50.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
